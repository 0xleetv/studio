<!doctype html><html><head><meta charset="utf-8"><title>probe</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#111;color:#fff;font:14px monospace}#o{position:fixed;top:8px;left:8px;z-index:9;white-space:pre}</style></head>
<body><div id="o">loading</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const out = [];
const O = (s) => { out.push(s); document.getElementById('o').textContent = out.join('\n'); };
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, .1, 60);
cam.position.set(0, .5, 5.2); cam.lookAt(0, .15, 0);
scene.add(new THREE.HemisphereLight('#D7DEEA', '#0A0B0E', .7));
const key = new THREE.DirectionalLight('#FFFFFF', 1.8); key.position.set(2.6, 3.8, 2.2); scene.add(key);
const rim = new THREE.PointLight('#2C63E8', 10, 10, 2); rim.position.set(-2.4, 1.4, -1.8); scene.add(rim);
new GLTFLoader().load('assets/shoe2.glb', async (g) => {
  const root = g.scene;
  let n = 0, names = [], vdef = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    n++; names.push(o.material && o.material.name);
    const e = o.userData.gltfExtensions || {};
    if (e.KHR_materials_variants) vdef++;
  });
  O('meshes ' + n + ' variantDefs ' + vdef);
  O('matNames ' + JSON.stringify(names));
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3();
  root.traverse((o) => { if (o.isMesh) bb.expandByObject(o); });
  const size = bb.getSize(new THREE.Vector3());
  const s = 1.55 / Math.max(size.x, size.y, size.z);
  root.scale.setScalar(s); root.updateMatrixWorld(true);
  const bb2 = new THREE.Box3();
  root.traverse((o) => { if (o.isMesh) bb2.expandByObject(o); });
  const c = bb2.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= bb2.min.y;
  O('size ' + size.x.toFixed(1) + ',' + size.y.toFixed(1) + ',' + size.z.toFixed(1) + ' scale ' + s.toFixed(4));
  scene.add(root);
  O('ROT0 facing check');
  const tick = () => { requestAnimationFrame(tick); renderer.render(scene, cam); };
  tick();
}, undefined, (e) => { O('ERR ' + (e && (e.message || e))); });
</script></body></html>
