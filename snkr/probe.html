<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>body{margin:0}#out{position:fixed;top:0;left:0;background:#000;color:#0f0;font:12px monospace;padding:4px;z-index:9;white-space:pre-wrap;max-width:100%}</style>
</head><body><pre id="out">starting</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const out = document.getElementById('out');
const lines = [];
const log = (m) => { lines.push(m); out.textContent = lines.join('\n'); };
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#101114');
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, .1, 60);
camera.position.set(0, .5, 5.2); camera.lookAt(0, .15, 0);
scene.add(new THREE.HemisphereLight('#D7DEEA', '#0A0B0E', .5));
const key = new THREE.DirectionalLight('#FFFFFF', 1.8); key.position.set(2.6, 3.8, 2.2); scene.add(key);
new GLTFLoader().load('assets/shoe.glb', (g) => {
  const root = g.scene;
  const sizes = [];
  root.traverse((o) => {
    if (o.isMesh) {
      o.geometry.computeBoundingBox();
      const s = new THREE.Vector3(); o.geometry.boundingBox.getSize(s);
      sizes.push(o.name.slice(0, 26) + ' ' + s.x.toFixed(1) + 'x' + s.y.toFixed(1) + 'x' + s.z.toFixed(1));
    }
  });
  log(sizes.length + ' meshes. sizes:');
  log(sizes.join('\n'));
  root.traverse((o) => { if (o.isMesh && /lConv/i.test(o.name)) o.visible = false; });
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3();
  root.traverse((o) => { if (o.isMesh && o.visible) bb.expandByObject(o); });
  const size = bb.getSize(new THREE.Vector3());
  const s = 1.55 / Math.max(size.x, size.y, size.z);
  root.scale.setScalar(s);
  root.updateMatrixWorld(true);
  const bb2 = new THREE.Box3();
  root.traverse((o) => { if (o.isMesh && o.visible) bb2.expandByObject(o); });
  const c2 = bb2.getCenter(new THREE.Vector3());
  root.position.x -= c2.x; root.position.z -= c2.z; root.position.y -= bb2.min.y;
  log('VISIBLE bbox ' + size.x.toFixed(1) + 'x' + size.y.toFixed(1) + 'x' + size.z.toFixed(1) + ' scale=' + s.toFixed(5) + ' center=' + c2.x.toFixed(1) + ',' + c2.y.toFixed(1) + ',' + c2.z.toFixed(1));
  scene.add(root);
  const spin = () => { root.rotation.y += .004; renderer.render(scene, camera); requestAnimationFrame(spin); };
  spin();
}, undefined, (e) => log('ERR ' + (e && (e.message || e))));
</script></body></html>
