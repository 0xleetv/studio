<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SHADE. A monolith split into two realities. Scroll to move through the chapters, drag the seam.">
<title>SHADE</title>
<link rel="stylesheet" href="style.v3.css">
</head>
<body>
<div class="track" id="track"></div>
<header><span class="mark">SHADE</span></header>
<h1 id="word" aria-live="polite"><span class="wc wl" id="wl">THE SLAB</span><span class="wc wr" id="wr" aria-hidden="true"></span></h1>
<canvas id="stage"></canvas>
<p id="caption" aria-live="polite">One surface. One truth.</p>
<script src="app.v7.js"></script>
<script>
setInterval(function(){
 try{
  var c=document.getElementById("stage"),x=c.getContext("2d"),W=c.width,H=c.height;
  function avg(px){var r=0,g=0,b=0,n=0;for(var i=0;i<px.length;i+=4){r+=px[i];g+=px[i+1];b+=px[i+2];n++;}return Math.round(r/n)+","+Math.round(g/n)+","+Math.round(b/n);}
  var a=avg(x.getImageData(Math.floor(W*.489),Math.floor(H*.5),10,6).data);
  var b2=avg(x.getImageData(Math.floor(W*.509),Math.floor(H*.5),10,6).data);
  var t="?";
  if(window.__dbgTex&&window.__dbgTex.w){var tg=window.__dbgTex.w.getContext("2d");t=avg(tg.getImageData(200,256,10,6).data);}
  document.title="L"+a+" R"+b2+" T"+t;
 }catch(e){document.title="ERR "+e.message;}
},1200);
</script>
</body>
</html>
